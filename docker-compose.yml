name: church-attendance

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d church_attendance"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Https__Redirect: "false"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=church_attendance;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters)}
      Jwt__Issuer: ChurchAttendance
      Jwt__Audience: ChurchAttendance.Web
      Seed__AdminUsername: admin
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-ChangeMe#123!}
      Seed__AdminEmail: admin@church.local
      Cors__AllowedOrigins__0: http://localhost:8088
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8088:80"

volumes:
  postgres-data:
